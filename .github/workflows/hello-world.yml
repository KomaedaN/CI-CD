name: exo1

on:
  workflow_dispatch:
  
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm ci
      - run: npm test
      -run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
